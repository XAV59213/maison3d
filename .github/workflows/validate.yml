name: Validate Maison 3D

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Python and JSON
        run: |
          python -m pip install --quiet voluptuous
          python -m compileall -q custom_components/maison3d
          python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: |
          node --check custom_components/maison3d/www/maison3d-panel.js
          node --check custom_components/maison3d/www/maison3d-card.js
          node --check custom_components/maison3d/www/maison3d-card-editor.js
          node --check custom_components/maison3d/www/architecture.js
          node --check custom_components/maison3d/www/presentation.js
          node --check custom_components/maison3d/www/interior-view.js
          node --check custom_components/maison3d/www/barn-interior.js
          node --check custom_components/maison3d/www/scene3d.js
          node --check custom_components/maison3d/www/world-ambience.js
          node --check custom_components/maison3d/www/photo-view.js
          node --check custom_components/maison3d/www/photo-source.js
          node tests/test_main_photo.mjs
          node tests/test_weather_photos.mjs
          node --check custom_components/maison3d/www/ha-storage.js
          node --check custom_components/maison3d/www/storage-bridge.js
          node tests/test_storage_bridge.mjs
          node --check custom_components/maison3d/www/media-resolver.js
          node tests/test_media_resolver.mjs
          node tests/test_upload_photo.mjs
          node --check custom_components/maison3d/www/scene-layout.js
          node tests/test_scene_layout.mjs
          node --check custom_components/maison3d/www/sensor-values.js
          node tests/test_sensor_values.mjs
          node --check custom_components/maison3d/www/hass-tracker.js
          node tests/test_hass_tracker.mjs
          node --check custom_components/maison3d/www/moon-effects.js
          node --check custom_components/maison3d/www/season-effects.js
          node tests/test_seasons.mjs
          node --check custom_components/maison3d/www/draft.js
          node tests/test_draft.mjs
          node --check custom_components/maison3d/www/frost-effects.js
          node tests/test_frost.mjs
          node --check custom_components/maison3d/www/photo-cinematics.js
          node --check custom_components/maison3d/www/weather-effects.js
          node --check custom_components/maison3d/www/vendor/three/addons/controls/OrbitControls.js
          test -f custom_components/maison3d/www/vendor/three/three.module.min.js
          ! grep -rn "cdn.jsdelivr.net" custom_components/maison3d/www/index.html
          python - <<'PY'
          import pathlib, re
          page = pathlib.Path('custom_components/maison3d/www/index.html').read_text()
          code = re.search(r'<script type="module">(.*?)</script>', page, re.S).group(1)
          pathlib.Path('/tmp/maison3d-inline.mjs').write_text(code)
          PY
          node --check /tmp/maison3d-inline.mjs

  validate-hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify HACS integration structure
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
