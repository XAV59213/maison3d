name: Publish Maison 3D v2.9.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-9-0.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify realistic barn interior, real photo button and version
        run: |
          python -m pip install --quiet voluptuous
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("custom_components/maison3d")
          www=root/"www"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.9.0"
          barn=(www/"barn-interior.js").read_text()
          interior=(www/"interior-view.js").read_text()
          page=(www/"index.html").read_text()
          # PR #30 : intérieur réaliste de la grange
          assert "export function buildBarnInterior(" in barn
          room=re.search(r"BARN_ROOM=\{width:([\d.]+),depth:([\d.]+),height:([\d.]+)\}",barn)
          w,d,h=map(float,room.groups())
          assert abs(d/w-3)<=.3 and abs(h-2.5)<=.1
          assert 'BARN_PHOTO="./images/grange-interieur.webp"' in barn
          photo=www/"images"/"grange-interieur.webp"
          data=photo.read_bytes()
          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP" and len(data)<400_000
          assert 'from "./barn-interior.js"' in interior and '"barn-interior.js"' in page
          for marker in ("📷 Photo réelle","⬡ Vue 3D","maison3d-interior-photo","drawBarn(building)","camera.layers.set(BARN_LAYER)"):
              assert marker in interior, marker
          assert "Volumes intérieurs provisoires" in interior
          readme=Path("README.md").read_text()
          assert "**Version actuelle : v2.9.0**" in readme
          assert "**📷 Photo réelle**" in readme and "volume provisoire" in readme
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.9.0 >/dev/null 2>&1; then
            echo "v2.9.0 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.9.0 — Intérieur réaliste de la grange et photo réelle

          ### 🏚 Intérieur de la grange réaliste (#30)
          - La visite **🏚 Intérieur grange** n'est plus un volume provisoire : la pièce est modélisée d'après une photo réelle prise depuis l'entrée.
          - Pièce d'environ **5 × 15 m** (profondeur ≈ 3 × la largeur), plafond blanc à **2,5 m** avec spots, sol gris façon parquet.
          - **À gauche (1er tiers)** : rack serveur vitré, paravent en osier, étagère en fer forgé, bureau avec deux écrans et fauteuil ; fenêtre à volets et climatiseur, panneau jaune, porte vitrée.
          - **Au centre (2e tiers)** : grande table en bois clair et chaises orange.
          - **Au fond** : canapé d'angle en cuir noir, écran de projection et enceintes, boule à facettes.
          - **Au fond à droite** : bar arrondi façon bambou, tabourets, étagères à bouteilles, réfrigérateur.
          - **À droite** : moto de tourisme rouge, armoires blanches et borne d'arcade contre le mur, volière au premier plan.
          - Arrivée au même point de vue que la photo ; champ plus large sur téléphone en portrait.
          - Pendant la visite, le reste de la scène, le soleil et les effets météo extérieurs sont masqués ; tout revient avec **↩ Extérieur**.

          ### 📷 Bouton Photo réelle
          - Dans la grange, la barre de visite affiche **📷 Photo réelle** : la photo de l'intérieur s'ouvre en plein écran (WebP 1500×845, ~184 Ko).
          - **⬡ Vue 3D** revient au modèle. Le bouton n'apparaît que dans la grange.

          ### À savoir
          - Dimensions et positions **estimées** d'après la photo (aucun relevé) ; mobilier simplifié en volumes.
          - **La maison garde un volume provisoire** : faute de plans et de photos intérieures, son intérieur n'est pas encore reconstitué.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.9.0**, puis redémarrer Home Assistant. Pas besoin de vider le cache du navigateur.

          ### Contrôles
          - La PR #30 a passé les tests Python et JavaScript, HACS et Hassfest.
          - Vérifiée dans Chrome headless avec un Home Assistant simulé : vue depuis l'entrée, iPhone, vue de dessus, bouton Photo réelle aller-retour, retour à l'extérieur, et toutes les régressions (3D, carte, cache, Enregistrer, photo).

          Le rendu sur votre Home Assistant réel reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.9.0 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.9.0 — Intérieur réaliste de la grange et photo réelle" --notes-file /tmp/notes.md
