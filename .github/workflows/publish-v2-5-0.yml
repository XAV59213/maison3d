name: Publish Maison 3D v2.5.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-5-0.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify edit banner layout, WebP photos, hass tracker, clean HA integration and version
        run: |
          python -m pip install --quiet voluptuous
          python - <<'PY'
          import json
          from pathlib import Path
          repo=Path(".")
          root=Path("custom_components/maison3d")
          www=root/"www"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.5.0"
          assert manifest.get("single_config_entry") is True
          # PR #21 : placement des barres de la scène
          index=(www/"index.html").read_text()
          assert "createSceneLayout" in index
          assert "export function createSceneLayout" in (www/"scene-layout.js").read_text()
          # PR #22 : photos WebP et set hass allégé
          tracked=[p for p in repo.rglob("*") if ".git" not in p.parts and p.is_file()]
          assert not [p for p in tracked if p.suffix.lower() in {".jpg",".jpeg"}], "JPEG fournis restants"
          assert (www/"maison3d-reference.webp").is_file()
          assert len(list((www/"images").glob("*.webp")))>=18
          assert "maison3d-reference.webp" in (www/"photo-source.js").read_text()
          for name in ("maison3d-card.js","maison3d-panel.js"):
              src=(www/name).read_text()
              assert "createHassTracker" in src, name
              assert "Object.values(states)" not in src, name
          # PR #23 : intégration propre
          sensor=(root/"sensor.py").read_text()
          assert '_attr_translation_key = "sensors_status"' in sensor
          assert "SensorDeviceClass.ENUM" in sensor
          assert "LEGACY_SOURCE_SENSORS" in sensor and "async_remove" in sensor
          init=(root/"__init__.py").read_text()
          assert "runtime_data" in init
          assert init.index("async_unload_platforms") < init.index("async_remove_panel")
          for lang in ("en","fr"):
              tr=json.loads((root/"translations"/f"{lang}.json").read_text())
              states=tr["entity"]["sensor"]["sensors_status"]["state"]
              assert set(states)=={"ok","not_configured","unavailable"}, lang
          assert (root/"icons.json").is_file()
          old="Mar"+"ly"
          for path in tracked:
              if path.suffix in {".jpg",".png",".webp",".zip",".pyc"}:
                  continue
              assert old not in path.read_text(encoding="utf-8", errors="ignore"), path
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.5.0 >/dev/null 2>&1; then
            echo "v2.5.0 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.5.0 — Bandeau d'édition visible, photos WebP et intégration plus propre

          ### ⚠️ Changement à vérifier : capteur de diagnostic
          - Les **9 capteurs de diagnostic sont remplacés par un seul : « État des capteurs »**. Son nom et ses états sont traduits en français et en anglais.
          - **Ses valeurs internes changent** : `ok`, `not_configured` et `unavailable` remplacent les anciens textes `OK`, `Non configuré` et `Indisponible`. L'affichage reste traduit, mais **une automatisation ou un modèle qui testait l'ancien texte doit être adapté**.
          - Les **8 anciens capteurs par source (« … - état ») sont supprimés automatiquement** au démarrage. Le capteur « État des capteurs » garde son entity_id. Le détail de chaque source reste disponible dans l'attribut `sensor_statuses`.

          ### 🖥️ Bandeau du mode Édition toujours visible
          - Le bandeau du mode Édition n'est plus caché par la barre des vues. Les barres et panneaux de la vue 3D se placent automatiquement sans se chevaucher.
          - Sur téléphone et en paysage, les barres de vues passent en bas et l'aide est masquée pour laisser la place à la scène.

          ### ⚡ Plus léger et plus rapide
          - Les photos fournies sont désormais en **WebP**, avec un rendu visuellement identique. Le dossier passe de 4,9 à 4,5 Mo, et le doublon de l'image du README a été supprimé.
          - Les anciens chemins `.jpg` des photos fournies continuent de fonctionner. Vos propres photos peuvent toujours être en JPEG, PNG ou WebP.
          - La carte et le panneau ne recalculent plus rien tant que les entités suivies ne changent pas. Une mise à jour de Home Assistant coûte nettement moins cher, même avec des milliers d'entités.

          ### 🧹 Intégration Home Assistant plus propre
          - Une seule installation de l'intégration est possible (`single_config_entry`). Les installations existantes continuent de fonctionner.
          - Données de l'entrée dans `runtime_data`. Au déchargement, les capteurs sont retirés avant le panneau.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.5.0**, redémarrer Home Assistant, puis actualiser le navigateur (Ctrl + F5). Pensez ensuite à vérifier vos automatisations qui utilisent le capteur de diagnostic.

          ### Contrôles
          Les PR #21, #22 et #23 ont passé :
          - les tests Python et JavaScript, ainsi que HACS et Hassfest ;
          - des tests sur un vrai cœur Home Assistant (nettoyage des anciens capteurs, installation unique, déchargement et rechargement) ;
          - des vérifications dans Chrome headless avec un Home Assistant simulé, sur bureau, téléphone et paysage.

          Le rendu réel sur votre Home Assistant et votre téléphone reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.5.0 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.5.0 — Bandeau d'édition visible, photos WebP et intégration plus propre" --notes-file /tmp/notes.md
