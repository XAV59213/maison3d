name: Publish Maison 3D v2.5.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-5-1.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Météo-France vigilances, sensor warnings, moon detection and version
        run: |
          python -m pip install --quiet voluptuous
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("custom_components/maison3d")
          www=root/"www"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.5.1"
          values=(www/"sensor-values.js").read_text()
          for word in ("vert","jaune","orange","rouge","green","yellow","red","verglas"):
              assert word in values, word
          for name in ("export function vigilanceLevel","export function precipitation","export function weatherKind",
                       "export function sensorIssues","export function issueText","export function isMoon","export function moonRank"):
              assert name in values, name
          for name in ("maison3d-card.js","maison3d-panel.js"):
              src=(www/name).read_text()
              assert 'from "./sensor-values.js"' in src, name
              assert "precipitation(" in src and "sensor_issues" in src, name
              assert "this._tracker.moon(states)" in src, name
          photo=(www/"photo-view.js").read_text()
          assert "weatherKind(" in photo and "sensor-warning" in photo and "storm_alert" in photo and "ice_alert" in photo
          assert "sensor-warning" in (www/"maison3d-card-editor.js").read_text()
          tracker=(www/"hass-tracker.js").read_text()
          assert "moonRank" in tracker and 'from "./sensor-values.js"' in tracker
          assert 'from "./sensor-values.js"' in (www/"moon-effects.js").read_text()
          readme=Path("README.md").read_text()
          assert "vigilance Météo-France" in readme and "**Version actuelle : v2.5.1**" in readme
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.5.1 >/dev/null 2>&1; then
            echo "v2.5.1 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.5.1 — Vigilances Météo-France, avertissements capteurs et détection de la lune

          ### 🟡 Vigilances Météo-France
          - Les capteurs **pluie** et **neige** acceptent maintenant les vigilances **Vert / Jaune / Orange / Rouge**, aussi en anglais (green, yellow, orange, red) et sans tenir compte des majuscules.
          - **Pluie** (ex. `sensor.alerte_pluie_inondation`) :
            - Jaune ou Orange → pluie ;
            - Rouge → orage.
          - **Neige** (ex. `sensor.alerte_neige_verglas`) :
            - Jaune, Orange ou Rouge → neige ;
            - si le capteur parle de **verglas** (ou *ice*) et qu'il fait **0 °C ou moins**, c'est l'effet **gel seul** qui s'affiche, à la place de la neige (si l'effet gel est activé).
          - **Vert** ne change rien.
          - Les capteurs numériques et on/off fonctionnent comme avant. On/off est maintenant reconnu quelle que soit la casse, partout.

          ### ⚠️ Avertissements sur les capteurs
          - Un petit avertissement apparaît sous un capteur choisi quand sa valeur n'est pas reconnue, ou qu'il est `unavailable`, `unknown` ou introuvable.
          - Il s'affiche dans le menu **⚙ Images / météo** et dans l'éditeur de la carte, **jamais sur l'image**.
          - Il disparaît dès que la valeur redevient valide.

          ### 🌙 Détection automatique de la lune
          - Si aucun capteur de lune n'est choisi, Maison 3D trouve seul un `sensor.*` :
            - dont l'identifiant contient `moon` ou `lune` (`moon_phase`, `phase_lune`, `phase_de_la_lune`…),
            - ou dont l'état est une phase connue (ex. « Premier croissant »).
          - S'il y en a plusieurs, l'identifiant anglais est préféré.
          - Les noms de phase sont compris en français comme en anglais, avec ou sans accents.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.5.1**, redémarrer Home Assistant puis actualiser le navigateur (Ctrl + F5).

          ### Contrôles
          La PR #24 a passé :
          - les tests Python et JavaScript (Vert, Jaune, Orange, Rouge, on/off, texte inconnu, détection de la lune), HACS et Hassfest ;
          - des vérifications dans Chrome headless avec un Home Assistant simulé : panneau, carte et éditeur.

          Le rendu sur votre Home Assistant réel reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.5.1 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.5.1 — Vigilances Météo-France, avertissements capteurs et détection de la lune" --notes-file /tmp/notes.md
