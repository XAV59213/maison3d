name: Publish Maison 3D v2.10.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-10-0.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify on-demand 3D, srcset copies, folding card bar and version
        run: |
          python -m pip install --quiet voluptuous pillow
          python - <<'PY'
          import json,re
          from pathlib import Path
          from PIL import Image
          root=Path("custom_components/maison3d")
          www=root/"www"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.10.0"
          page=(www/"index.html").read_text()
          main=re.search(r'<script type="module">(.*?)</script>',page,re.S).group(1)
          # PR #31 : three.js / scene3d.js chargés à la demande
          assert 'from "three"' not in main and "three/addons" not in main
          assert 'import("./scene3d.js")' in main and '"scene3d.js"' in page
          assert 'id="maison3d-scene-loading"' in page and "Chargement de la 3D…" in page
          scene=(www/"scene3d.js").read_text()
          assert 'import * as THREE from "three";' in scene and "export function startScene(" in scene
          for name in ("photo-view.js","interior-view.js","barn-interior.js","draft.js","ha-storage.js","photo-source.js"):
              assert not re.search(r'from\s+"three',(www/name).read_text()), name
          assert "if(answered)fn(haData," in (www/"ha-storage.js").read_text()
          # srcset + copies 640 / 960
          source=(www/"photo-source.js").read_text()
          photo=(www/"photo-view.js").read_text()
          interior=(www/"interior-view.js").read_text()
          assert "export const RESPONSIVE_WIDTHS=[640,960];" in source and "export function responsiveSrcset(path)" in source
          assert "image.srcset=srcset" in photo and "realImg.srcset=responsiveSrcset(" in interior
          fulls=[www/"maison3d-reference.webp",www/"images"/"grange-interieur.webp",
                 *sorted((www/"images").glob("*-jour.webp")),*sorted((www/"images").glob("*-nuit.webp"))]
          assert len(fulls)==16, len(fulls)
          for full in fulls:
              W,H=Image.open(full).size
              for w in (640,960):
                  copy=full.with_name(f"{full.stem}-{w}.webp")
                  assert Image.open(copy).size==(w,round(H*w/W)), copy
                  assert copy.stat().st_size<full.stat().st_size, copy
          # Barre repliable de la carte (état d'affichage, pas une modification)
          assert 'const BAR_KEY="maison3d:card-bar:v1";' in photo and '"☰ Menu":"▾ Réduire"' in photo
          assert "html.card-mode #maison3d-photo-controls.collapsed>:not(.bar-toggle):not(.maison3d-save.dirty){display:none!important}" in photo
          readme=Path("README.md").read_text()
          assert "**Version actuelle : v2.10.0**" in readme and "**☰ Menu**" in readme
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.10.0 >/dev/null 2>&1; then
            echo "v2.10.0 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.10.0 — Perf mobile : 3D à la demande, photos allégées, barre de carte repliable

          ### ⚡ La 3D n'est chargée qu'à la demande (#31)
          - La photo et la carte Lovelace **ne téléchargent plus three.js** (≈ 700 Ko).
          - La scène 3D (nouveau module `scene3d.js`) se charge à l'ouverture de **⬡ 3D éditable**, **▤ Plan 2D** ou d'une visite intérieure, ou dès le départ si la 3D / le plan était la dernière vue utilisée.
          - Un indicateur **« Chargement de la 3D… »** s'affiche pendant le téléchargement.
          - Le cache-busting `?v=` est conservé.

          ### 🖼️ Photos plus légères
          - La photo principale, les photos météo jour / nuit et la photo réelle de la grange existent aussi en **640 et 960 px** (`srcset` / `sizes`). Le navigateur prend la plus légère qui reste nette.
          - Sur un écran 2× ou 3×, la densité retenue est plafonnée à 1,5.
          - **Vos propres images (URL) ne changent pas.**
          - Les 4 anciennes photos (`jour`, `nuageux`, `pluie`, `neige`) restent livrées : elles sont encore référencées (compatibilité, script d'import).

          ### 📱 Barre du bas repliable dans la carte
          - **☰ Menu** déplie la barre de commandes, **▾ Réduire** la replie.
          - Repliée par défaut sur une carte étroite (≤ 600 px) ou un téléphone.
          - C'est un choix d'affichage retenu dans le navigateur, pas un réglage : il n'active pas **💾 Enregistrer**. Repliée, la barre garde 💾 Enregistrer visible tant qu'il reste des modifications.

          ### 📊 Mesures avant / après
          Chrome headless, cache vidé. Réseau « mobile » : 1,6 Mb/s, 150 ms, CPU ×4.

          | Ouverture | Octets chargés | dont three.js | Photo affichée (mobile) |
          |---|---|---|---|
          | Panneau desktop | 1 254 → 505 Ko | 707 → 0 Ko | 7,97 → 4,08 s |
          | Panneau iPhone | 1 253 → 504 Ko | 707 → 0 Ko | 7,95 → 4,05 s |
          | Carte iPhone (440 px) | 1 275 → 388 Ko | 707 → 0 Ko | 8,07 → 3,44 s |

          - Dans la carte sur iPhone, la photo passe de 336 Ko à la copie de 960 px (198 Ko).
          - En plein écran sur iPhone, la photo est recadrée : l'original reste utilisé.
          - La photo réelle de la grange sur iPhone passe de 180 à 45 Ko.
          - Ouvrir la 3D depuis la carte sur réseau mobile prend environ 4 s.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.10.0**, puis redémarrer Home Assistant. Pas besoin de vider le cache du navigateur.

          ### Contrôles
          - La PR #31 a passé les tests Python et JavaScript (dont le nouveau test des photos 640 / 960), HACS et Hassfest.
          - Vérifiée dans Chrome headless avec un Home Assistant simulé :
            - three.js absent en vue photo et dans la carte ;
            - chargement à la demande (3D, plan 2D, visite de la grange depuis la photo, dernière vue 3D) ;
            - `?v=` conservé, barre repliable ;
            - stockage HA (migration, autre appareil, non-admin, sans HA) et les régressions.

          Le rendu sur votre Home Assistant réel reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.10.0 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.10.0 — Perf mobile : 3D à la demande, photos allégées, barre de carte repliable" --notes-file /tmp/notes.md
