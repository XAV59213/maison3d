name: Publish Maison 3D v2.8.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-8-0.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify explicit save (draft.js), save button, test_draft, interior visits and version
        run: |
          python -m pip install --quiet voluptuous
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("custom_components/maison3d")
          www=root/"www"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.8.0"
          draft=(www/"draft.js").read_text()
          photo=(www/"photo-view.js").read_text()
          page=(www/"index.html").read_text()
          presentation=(www/"presentation.js").read_text()
          interior=(www/"interior-view.js").read_text()
          # PR #29 : brouillon + bouton Enregistrer / Annuler, plus d'enregistrement automatique
          for name in ("export function registerSection","export async function saveDraft","export function discardDraft","export function createSaveControls"):
              assert name in draft, name
          assert 'textContent="💾 Enregistrer"' in draft and 'textContent="↶ Annuler"' in draft
          assert "● Modifications non enregistrées" in draft and '"Enregistré ✓"' in draft
          assert 'window.addEventListener("beforeunload"' in draft and 'type:"maison3d:dirty"' in draft
          assert "const persist=()=>changed();" in photo and 'registerSection("photo_settings",' in photo
          assert "nav.append(photoBtn,planBtn,modelBtn,nightBtn,dayBtn,autoBtn,effectsBtn,optionsBtn,saveControls)" in photo
          assert "function save(){changed()}" in page and 'registerSection("layout",' in page
          assert '"draft.js"' in page
          assert "saveToHa(" not in presentation and 'registerSection("view",' in presentation
          assert photo.count("saveToHa(")==1 and page.count("saveToHa(")==1
          for name in ("maison3d-panel.js","maison3d-card.js"):
              assert '"maison3d:dirty"' in (www/name).read_text(), name
          assert Path("tests/test_draft.mjs").is_file()
          # PR #28 : visites intérieures
          assert "export function createInteriorExplorer(" in interior
          for label in ("↩ Extérieur","🚪 Intérieur maison","🏚 Intérieur grange"):
              assert label in interior, label
          assert 'import {createInteriorExplorer} from "./interior-view.js";' in page and '"interior-view.js"' in page
          readme=Path("README.md").read_text()
          assert "**Version actuelle : v2.8.0**" in readme
          assert "uniquement avec le bouton 💾 Enregistrer" in readme and "Intérieur maison" in readme
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.8.0 >/dev/null 2>&1; then
            echo "v2.8.0 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.8.0 — Bouton Enregistrer en 2D et 3D, premières visites intérieures

          ### ⚠️ Plus d'enregistrement automatique
          - Les modifications ne sont **plus enregistrées automatiquement**. Il faut cliquer sur **💾 Enregistrer**, sinon elles sont perdues au rechargement.
          - Cela concerne les réglages de la vue photo et du menu ⚙, les saisons (boutons « Tester » compris), les capteurs choisis et les objets de la vue 3D.
          - **L'envoi de photo (📤) reste immédiat** : le fichier part tout de suite dans `/config/www/maison3d/`. Son utilisation comme photo s'enregistre avec 💾 Enregistrer.

          ### 💾 Bouton Enregistrer (#29)
          - Chaque modification s'applique tout de suite à l'écran. **💾 Enregistrer** l'enregistre dans Home Assistant et dans le navigateur.
            - Il se trouve dans la barre des vues (photo, plan 2D, 3D, carte) et en haut du panneau ⚙.
            - Il est grisé sans modification, et orange avec « ● Modifications non enregistrées » dès qu'il y en a une.
          - **↶ Annuler** revient au dernier état enregistré.
          - Après le clic s'affiche « Enregistré ✓ », ou un message d'erreur ; les modifications sont alors gardées pour réessayer. Pour un utilisateur non administrateur, l'enregistrement se fait dans son navigateur.
          - Fermer ou recharger la page avec des modifications en attente affiche un avertissement.
          - Changer de vue ou de point de vue 3D n'est pas une modification ; la vue affichée est retenue au prochain enregistrement.

          ### 🏠 Premières visites intérieures (#28)
          - Nouveaux boutons **🚪 Intérieur maison**, **🏚 Intérieur grange** et **↩ Extérieur**, depuis la photo ou la vue 3D.
          - Ils ouvrent des volumes intérieurs 3D : sols, murs, éclairage, charpente de la grange, quelques meubles de démonstration.
          - Les volumes reprennent les dimensions des bâtiments du projet. Le bâtiment visité est seulement masqué le temps de la visite.
          - **Volumes provisoires** : faute de plans et de photos intérieures, ils ne reproduisent pas encore la vraie distribution des pièces.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.8.0**, puis redémarrer Home Assistant. Depuis la v2.7.0, plus besoin de vider le cache du navigateur.

          ### Contrôles
          - Les PR #28 et #29 ont passé les tests Python et JavaScript (dont le nouveau test du brouillon), HACS et Hassfest.
          - La #29 a aussi été vérifiée dans Chrome headless avec un Home Assistant simulé :
            - rien n'est enregistré avant le clic ;
            - enregistrement au clic, Annuler, rechargement ;
            - non-admin, erreur HA, carte de 320 px, iPhone en portrait et en paysage, et toutes les régressions.

          Le rendu sur votre Home Assistant réel reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.8.0 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.8.0 — Bouton Enregistrer en 2D et 3D, premières visites intérieures" --notes-file /tmp/notes.md
