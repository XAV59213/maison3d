name: Publish Maison 3D v2.0.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-0-1.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify integration version and 3D card
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('custom_components/maison3d')
          assert json.loads((root/'manifest.json').read_text())['version']=='2.0.1'
          assert (root/'www/maison3d-card.js').is_file()
          assert (root/'www/index.html').is_file()
          PY
      - name: Publish Maison 3D v2.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.0.1 >/dev/null 2>&1; then
            echo "Release v2.0.1 already exists"
            exit 0
          fi
          cat > /tmp/notes.md <<'EOF'
          ## Maison 3D v2.0.1

          ### Nouveau : véritable carte Lovelace 3D
          - La carte `custom:maison3d-card` affiche une scène interactive Three.js/WebGL directement dans les tableaux de bord Home Assistant.
          - Rotation et zoom 3D, synchronisation des conditions météo et soleil, choix d'une entité `weather.*`.
          - Le panneau latéral Maison 3D conserve les outils d'édition des bâtiments, terrasses, rampes et autres objets.
          - Vue compacte adaptée à la carte. Les scènes utilisent des géométries simplifiées : la photo du README est une **référence artistique**, pas un rendu produit automatiquement.

          ### Fiabilité et sécurité
          - Gestion améliorée des rechargements de panneau et de la route des ressources.
          - Relais météo fiabilisé.
          - Import JSON contrôlé, affichage des noms d'objets sécurisé, sauvegarde navigateur avec gestion des erreurs.
          - Validation CI, Hassfest et HACS.

          ### Installer via HACS (Integration)
          Installer ou mettre à jour Maison 3D vers v2.0.1, puis redémarrer Home Assistant.
          Pour la carte : ajouter une ressource JavaScript Module `/maison3d-assets/maison3d-card.js`, puis utiliser :
          ```yaml
          type: custom:maison3d-card
          title: Maison 3D
          height: 500
          weather_entity: weather.maison
          sun_entity: sun.sun
          ```
          Adapter le nom de votre entité météo. Ce module doit être installé comme **intégration HACS**, puis utilisé comme carte Lovelace.

          ### Limites
          - Pas encore de test fonctionnel dans une installation Home Assistant utilisateur.
          - Dépendance à jsDelivr pour les modules Three.js.
          - Le rendu reste un modèle 3D éditable simplifié, non photoréaliste.
          EOF
          gh release create v2.0.1 --target "${GITHUB_SHA}" --title "Maison 3D v2.0.1" --notes-file /tmp/notes.md
