name: Publish Maison 3D v2.3.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-3-1.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version and bundled photos
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          base=Path("custom_components/maison3d")
          assert json.loads((base/"manifest.json").read_text())["version"]=="2.3.1"
          names=("jour.jpg","nuageux.jpg","pluie.jpg","neige.jpg")
          hashes=set()
          source=(base/"www/photo-view.js").read_text(encoding="utf-8")
          for name in names:
              picture=base/"www/images"/name
              assert picture.is_file() and picture.stat().st_size>50000, name
              data=picture.read_bytes()
              assert data.startswith(bytes.fromhex("ffd8ff")) and data.endswith(bytes.fromhex("ffd9")), name
              hashes.add(sha256(data).hexdigest())
              assert "images/"+name in source, name
          assert len(hashes)==4, "The four photos must be distinct"
          print("All four genuine weather images verified.")
          PY
          node --check custom_components/maison3d/www/photo-view.js
          python3 -m unittest discover -s tests -q
      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.3.1 >/dev/null 2>&1; then
            echo "Release v2.3.1 already exists"
            exit 0
          fi
          cat > /tmp/notes.md <<'EOF'
          ## Maison 3D v2.3.1 — Quatre vraies photos météo livrées via HACS

          Cette version corrige la sélection automatique des photos dans la vue photographique et inclut **les quatre JPEG fournis dans le dépôt**.

          ### Images réellement intégrées
          - Jour / soleil : `/maison3d-assets/images/jour.jpg`
          - Nuageux : `/maison3d-assets/images/nuageux.jpg`
          - Pluie : `/maison3d-assets/images/pluie.jpg`
          - Neige : `/maison3d-assets/images/neige.jpg`

          Les photos sont servies directement par l'intégration Home Assistant ; il n'est plus nécessaire de les copier dans `/config/www/` ni de renommer les fichiers.

          ### Animations et configuration
          Les effets animés de soleil, nuages, pluie, neige, feuilles, vent et éclairs, l'intensité réglable et les réglages de capteurs météo/soleil/lune restent disponibles. Les images personnalisées de la carte continuent de prendre priorité sur les photos livrées.

          **Les états nuit, vent, orage et les phases lunaires n'ont pas encore de JPEG distinct livré par défaut** : ces vues restent personnalisables avec effets animés.

          ### Installation
          HACS → Maison 3D → Mettre à jour vers v2.3.1, puis redémarrer Home Assistant et rafraîchir le navigateur. Ressource Lovelace : `/maison3d-assets/maison3d-card.js`.

          Validations GitHub Actions HACS, Hassfest et tests Python/JavaScript vertes sur la PR #7. Les essais visuels sur l'installation réelle restent recommandés.
          EOF
          gh release create v2.3.1 --target "${GITHUB_SHA}" --title "Maison 3D v2.3.1 — Photos météo intégrées" --notes-file /tmp/notes.md
