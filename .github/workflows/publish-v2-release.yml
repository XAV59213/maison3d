name: Publish Maison 3D v2.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-release.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest release version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/maison3d/manifest.json').read_text())
          assert manifest['version'] == '2.0.0', f"Expected 2.0.0 but got {manifest['version']}"
          assert manifest['domain'] == 'maison3d'
          PY
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "Release v2.0.0 already exists: no duplicate created."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Maison 3D v2.0.0 — Home Assistant

          Première version installable via HACS comme **intégration**.
          
          ### Fonctions
          - Panneau Maison 3D accessible dans la barre latérale.
          - Terrain et bâtiments 3D modifiables, escalier, rampe et objets sélectionnables.
          - Import et export JSON de la configuration de la scène.
          - Transmission de l'état de la première entité `weather.*` et de `sun.sun`.
          - Animations visuelles pluie, neige, feuilles d'automne, transitions jour/soir/nuit.
          - Logo et icône de marque, documentation française.

          ### Installation
          Dans HACS, ajouter `https://github.com/XAV59213/maison3d` comme dépôt personnalisé de type **Intégration** ; installer Maison 3D ; redémarrer Home Assistant ; puis ajouter l'intégration via Paramètres > Appareils et services.

          ### Limites importantes
          - Le modèle 3D actuel est une maquette modifiable : il n'atteint pas encore le rendu photoréaliste de l'image de référence dans le README.
          - Three.js est chargé depuis un CDN : une connexion Internet est nécessaire.
          - Aucun contrôle des entités Home Assistant (portail, éclairage, etc.) n'est encore implémenté.
          - CI/Hassfest/HACS vérifiés ; installation dans une instance Home Assistant réelle encore à confirmer.
          EOF
          gh release create v2.0.0 --target "${GITHUB_SHA}" --title "Maison 3D v2.0.0" --notes-file /tmp/release-notes.md
