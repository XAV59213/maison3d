name: Publish Maison 3D v2.10.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-10-1.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify blurred barn photos, version and tests
        run: |
          python -m pip install --quiet voluptuous pillow
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          root = Path("custom_components/maison3d")
          www = root / "www"
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["version"] == "2.10.1"
          readme = Path("README.md").read_text()
          assert "**Version actuelle : v2.10.1**" in readme
          images = www / "images"
          # SHA-256 of the unblurred files published in v2.10.0 (and v2.9.0 for the 1500 px original).
          old = {
              "grange-interieur.webp": "916f70c5e4a711bcac7e91a9e176ef00b71ef8a56b40c2691265fcac6517b3a4",
              "grange-interieur-640.webp": "4099cf76a7e194726aea2e09bba77a90d0a548df8b60ae8a8b88bce3d7b6338b",
              "grange-interieur-960.webp": "ff89cae7f4258bc130c18aabcc484e95422b7f5ed78eff6a6a44fd4ef96c5566",
          }
          sizes = {
              "grange-interieur.webp": (1500, 845),
              "grange-interieur-640.webp": (640, 361),
              "grange-interieur-960.webp": (960, 541),
          }
          full = images / "grange-interieur.webp"
          for name, expected in sizes.items():
              path = images / name
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              assert digest != old[name], f"{name} is still the unblurred v2.10.0 file"
              assert Image.open(path).size == expected, name
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", name
              if name != "grange-interieur.webp":
                  assert path.stat().st_size < full.stat().st_size, name
          assert full.stat().st_size < 400_000
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.10.1 >/dev/null 2>&1; then
            echo "v2.10.1 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.10.1 — Vie privée : plaque floutée sur la photo de la grange

          ### 🔒 Photo de la grange (#32)
          - La plaque d'immatriculation visible sur la moto, dans la photo réelle de l'intérieur de la grange, est désormais illisible.
          - Le flou s'applique à l'original 1500 px et aux copies 640 et 960 px utilisées sur mobile (`srcset`).
          - Le reste de la photo et le modèle 3D ne changent pas.

          ### ⚠️ L'ancienne photo reste dans l'historique
          Cette version ne purge pas l'historique git. L'image d'origine (plaque lisible) reste accessible dans :
          - les commits de la #30 et suivants (fusion #30, release v2.9.0, fusion #31, release v2.10.0) ;
          - les tags **v2.9.0** et **v2.10.0** ;
          - les archives source (`zipball` / `tarball`) de ces releases. Aucun fichier n'avait été ajouté séparément comme asset de release.

          Les retirer (git filter-repo, force-push, puis recréation des tags et des releases) demanderait un accord séparé.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.10.1**, puis redémarrer Home Assistant. Pas besoin de vider le cache du navigateur.

          ### Contrôles
          - La PR #32 a passé les tests Python et JavaScript, HACS et Hassfest.
          - Le workflow de publication vérifie que les trois `grange-interieur*.webp` ne sont plus ceux de la v2.10.0, et relance les tests.

          Le rendu sur votre Home Assistant réel reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.10.1 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.10.1 — Vie privée : plaque floutée sur la photo de la grange" --notes-file /tmp/notes.md
