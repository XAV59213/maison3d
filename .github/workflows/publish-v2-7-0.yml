name: Publish Maison 3D v2.7.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-7-0.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify degraded state, startup grace, wind in km/h, ?v= cache-busting, filters and version
        run: |
          python -m pip install --quiet voluptuous
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("custom_components/maison3d")
          www=root/"www"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.7.0"
          sensor=(root/"sensor.py").read_text()
          init=(root/"__init__.py").read_text()
          values=(www/"sensor-values.js").read_text()
          photo=(www/"photo-view.js").read_text()
          card=(www/"maison3d-card.js").read_text()
          panel=(www/"maison3d-panel.js").read_text()
          editor=(www/"maison3d-card-editor.js").read_text()
          tracker=(www/"hass-tracker.js").read_text()
          page=(www/"index.html").read_text()
          # degraded remplace unavailable + délai de grâce au démarrage
          assert 'STATE_DEGRADED = "degraded"' in sensor and "STARTUP_GRACE_SECONDS = 30" in sensor
          assert "async_at_started(self.hass, _started)" in sensor and "async_call_later" in sensor
          assert '_unrecorded_attributes = frozenset({"sensor_statuses", "entities"})' in sensor
          for name in ("strings.json","translations/fr.json","translations/en.json","icons.json"):
              text=(root/name).read_text()
              assert '"degraded"' in text and '"unavailable"' not in text.split('"sensors_status"')[1].split("}")[0], name
          # Vent converti en km/h
          assert "export function toKmh(" in values and "export function windKmh(" in values
          for name,src in (("card",card),("panel",panel)):
              assert "windKmh(" in src and "km/h" in src, name
          assert "toKmh(event.data.windSpeed" in photo
          # Cache-busting ?v=
          assert 'module_url=f"{ASSETS_URL}/maison3d-panel.js?v={version}"' in init
          assert 'card_url = f"{CARD_URL}?v={version}"' in init
          assert "async_add_executor_job(_frontend_present)" in init
          for name,src in (("card",card),("panel",panel),("editor",editor),("tracker",tracker)):
              assert 'new URL(import.meta.url).searchParams.get("v")' in src, name
          assert 'id="maison3d-importmap"' in page and 'el.type="importmap"' in page
          assert 'frame.src = "/maison3d-assets/index.html" + V;' in panel
          assert '"/maison3d-assets/index.html?mode=card"+(VERSION?"&v="' in card
          assert "V2.0" not in page and "V2.0" not in panel
          # Filtres des sélecteurs
          assert "moonPhase(entity.state)!==null" in values
          assert 'const cloudWords=at("cloud|nuage|nebulosit|couverture")' in values
          assert 'const notCloud=at("humid|disk|disque|battery|batterie")' in values
          assert 'const notWind=at("pace|allure")' in values
          assert 'const snowWords=at("snow|neige|verglas|ice|icy")' in values
          # Vigilance pluie jaune + nuit au fuseau HA
          assert "rain.vigilance===1?0:rain.value" in values
          assert "haHour(haTimeZone)" in photo
          readme=Path("README.md").read_text()
          assert "**Version actuelle : v2.7.0**" in readme and "`degraded`" in readme
          PY
          for f in custom_components/maison3d/www/*.js; do
            node --check "$f"
          done
          for t in tests/*.mjs; do
            node "$t"
          done
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.7.0 >/dev/null 2>&1; then
            echo "v2.7.0 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'NOTES'
          ## Maison 3D v2.7.0 — Retours de production : état dégradé, vent en km/h, filtres, fin du cache

          ### ⚠️ À lire avant de mettre à jour
          - **`degraded` remplace `unavailable`** sur `sensor.maison_3d_etat_des_capteurs` (affiché « Dégradé »). **Adaptez les automatisations** qui testaient `unavailable`.
          - Pendant les **30 secondes qui suivent le démarrage** de Home Assistant, une entité pas encore chargée (Netatmo, Météo-France…) ne rend plus le capteur dégradé.
          - **Le vent est désormais converti en km/h** avant d'appliquer les seuils. L'unité vient du capteur vent, sinon de `wind_speed_unit` de la météo ; m/s, mph, nœuds, ft/s et Beaufort sont reconnus. Un capteur en m/s déclenche maintenant l'effet vent **dès 7 m/s** (25 km/h), et plus à 25 m/s.

          ### 🎛️ Sélecteurs plus précis
          - Nuages : nom contenant nuage / cloud / couverture **et** unité %, jamais humidité, disque ou batterie.
          - Lune : seulement les capteurs dont l'état est une phase de lune reconnue. Ça vaut aussi pour la détection automatique.
          - Vent : `device_class: wind_speed` en premier, jamais une allure.
          - Pluie : pluie / inondation / rain / flood, sans les détecteurs de fuite. Neige : neige / verglas / snow / ice.

          ### 🧹 Plus besoin de vider le cache
          - Le panneau, la carte, leurs modules et la vue intégrée sont chargés avec `?v=<version>`. **Après cette mise à jour et les suivantes, plus besoin de vider le cache du navigateur.**

          ### Autres corrections
          - Une vigilance pluie **jaune** ne force plus la photo pluie si la météo est sèche. L'orange et le rouge la forcent toujours.
          - Sans entité soleil, la nuit de secours suit le fuseau horaire de Home Assistant, et non plus celui de l'appareil.
          - Les messages d'URL d'image invalide citent `/maison3d-media/` et `media-source://`.
          - Le titre de la vue devient « Maison 3D » au lieu de « Maison 3D V2.0 ».
          - Les attributs détaillés du capteur d'état ne sont plus enregistrés dans l'historique.
          - Les fichiers ne sont plus vérifiés de façon bloquante au démarrage.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.7.0**, puis redémarrer Home Assistant.

          ### Contrôles
          La PR #27 a passé :
          - les tests Python et JavaScript, les tests sur un vrai Home Assistant, HACS et Hassfest ;
          - des vérifications dans Chrome headless avec un Home Assistant simulé : carte et panneau avec et sans `?v=`, puis toutes les régressions.

          Le rendu sur votre Home Assistant réel reste à vérifier.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v2.7.0 --target "${GITHUB_SHA}" --latest --title "Maison 3D v2.7.0 — Retours de production : état dégradé, vent en km/h, filtres, fin du cache" --notes-file /tmp/notes.md
