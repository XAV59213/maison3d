name: Publish Maison 3D v2.3.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-3-6.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify main photo options, effects and version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("custom_components/maison3d")
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["version"]=="2.3.6"
          options=(root/"config_flow.py").read_text()
          photo=(root/"www/photo-view.js").read_text()
          card=(root/"www/maison3d-card.js").read_text()
          assert 'vol.Optional("base_image_url"' in options
          assert 'vol.Optional("effects_enabled"' in options
          assert 'effectsBtn.addEventListener("click"' in photo
          assert 'skyMoon.draw(phaseName,night,state.effect&&Boolean(phaseName)' in photo
          assert 'section.classList.toggle("effects-off",!state.effect)' in photo
          assert 'base_image_url:this._config.base_image_url||' in card
          assert (root/"www/photo-source.js").is_file()
          assert (root/"www/maison3d-reference.jpg").is_file()
          PY
          node --check custom_components/maison3d/www/photo-source.js
          node --check custom_components/maison3d/www/photo-view.js
          node --check custom_components/maison3d/www/maison3d-card-editor.js
          node tests/test_main_photo.mjs
          node tests/test_seasons.mjs
          python3 -m unittest discover -s tests -q
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.3.6 >/dev/null 2>&1; then
            echo "v2.3.6 already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'EOF'
          ## Maison 3D v2.3.6 — Votre photo personnelle et vos effets ON/OFF

          ### Image principale personnalisable
          - Configurez votre propre photo dans **Paramètres → Appareils et services → Maison 3D → Configurer**, champ **Image principale**.
          - Utilisez par exemple `/local/maison3d/ma-maison.jpg` après avoir placé la photo dans `/config/www/maison3d/ma-maison.jpg`.
          - Une carte Lovelace peut utiliser une autre photo grâce à l'option `base_image_url`.
          - L'éditeur visuel et le panneau Photo proposent la vérification et l'aperçu de la photo.
          - En cas d'image inaccessible, la photographie officielle reste le repli automatique.

          ### Désactiver ou activer les effets
          - Option globale Home Assistant **Activer les effets météo, lumineux et saisonniers**.
          - Dans l'éditeur Lovelace : hériter de l'intégration, activer ou désactiver pour cette carte.
          - Bouton direct **✦ Effets ON / ○ Effets OFF** et case dans le panneau de la vue photo.
          - L'arrêt des effets désactive les animations, la lune dessinée et les filtres lumineux, tout en gardant l'image affichée.

          ### Fonctionnalités conservées
          Photo officielle fixe par défaut, plan 2D, modèle 3D, animations météo, phase de lune, quatre saisons selon le fuseau horaire de Home Assistant et outils de prévisualisation.

          ### Installer
          Dans HACS, mettre à jour **Maison 3D vers v2.3.6**, redémarrer Home Assistant puis actualiser le navigateur (Ctrl + F5). Ajouter l'intégration si nécessaire. La ressource carte reste `/maison3d-assets/maison3d-card.js`.

          ### Contrôles
          La PR #12 a passé avec succès les tests Python/JavaScript, HACS et Hassfest. Le rendu réel sur votre Home Assistant devra être vérifié.
          EOF
          gh release create v2.3.6 --target "${GITHUB_SHA}" --title "Maison 3D v2.3.6 — Photo personnalisable et effets ON/OFF" --notes-file /tmp/notes.md
