name: Publish Maison 3D v2.3.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2-3-5.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'XAV59213/maison3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Plan 2D and HA seasonal calendar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("custom_components/maison3d")
          assert json.loads((root/"manifest.json").read_text())["version"]=="2.3.5"
          photo=(root/"www/photo-view.js").read_text()
          assert 'planBtn.textContent="▤ Plan 2D"' in photo
          assert 'automaticSeason(haTimeZone)' in photo
          assert 'seasonalEffects.frame(time,seasonNow()' in photo
          assert 'photoBtn.setAttribute("aria-pressed"' in photo
          for name in ("jour.jpg","nuageux.jpg","pluie.jpg","neige.jpg"):
              data=(root/"www/images"/name).read_bytes()
              assert data.startswith(bytes.fromhex("ffd8ff"))
          PY
          node --check custom_components/maison3d/www/photo-view.js
          node --check custom_components/maison3d/www/season-effects.js
          node tests/test_seasons.mjs
          python3 -m unittest discover -s tests -q
      - name: Publish release v2.3.5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.3.5 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          cat >/tmp/notes.md <<'EOF'
          ## Maison 3D v2.3.5 — Plan 2D restauré et calendrier des quatre saisons

          ### Les trois vues sont accessibles
          - **Photo réelle** : photo officielle fixe avec animations météo.
          - **Plan 2D** : accessible dans la barre visible au-dessus de la photo, avec caméra vue de dessus.
          - **3D éditable** : retour à la caméra 3D et à l'éditeur.

          ### Module des quatre saisons
          Le nouveau `season-effects.js` détermine automatiquement la saison depuis la **date et le fuseau horaire configuré dans Home Assistant** (exemple : Europe/Paris), pas depuis l'heure locale du téléphone.
          - Printemps : **1er mars au 31 mai** — pétales et teintes vertes.
          - Été : **1er juin au 31 août** — lumière chaude et points lumineux nocturnes.
          - Automne : **1er septembre au 30 novembre** — feuilles et tonalité ambrée.
          - Hiver : **1er décembre à fin février** — flocons et voile hivernal.

          Les saisons se mettent à jour au passage de minuit ; les boutons du panneau de droite permettent de forcer chaque saison ou de revenir en **Saisons auto**. Les effets météo réels s'ajoutent à la saison sur la **même photo officielle**, sans remplacer les bâtiments ou le jardin.

          ### Installation
          HACS → Maison 3D → **v2.3.5**, redémarrer Home Assistant puis rafraîchir le navigateur. Tester Photo réelle, Plan 2D, 3D éditable et les 4 saisons.

          ### Validation
          GitHub Actions : tests Python/JavaScript, HACS, Hassfest, et tests de changement de date et de fuseau horaire réussis. Un essai visuel sur Home Assistant reste recommandé.
          EOF
          gh release create v2.3.5 --target "${GITHUB_SHA}" --title "Maison 3D v2.3.5 — Plan 2D et quatre saisons Home Assistant" --notes-file /tmp/notes.md
